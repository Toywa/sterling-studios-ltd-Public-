<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- =====================================================
         FAVICON / APP ICON
         ===================================================== -->

    <link
      rel="icon"
      type="image/png"
      href="/favicon.png"
    />

    <link
      rel="shortcut icon"
      type="image/png"
      href="/favicon.png"
    />

    <link
      rel="apple-touch-icon"
      href="/favicon.png"
    />

    <!-- =====================================================
         PRIMARY SEO FALLBACK
         Route-specific metadata is managed by src/components/SEO.jsx
         ===================================================== -->

    <title>
      Sterlings Studio | Web Design, Web Apps & Mobile Development Nairobi
    </title>

    <meta
      name="description"
      content="Sterlings Studio designs and develops professional websites, custom web applications, Android and iOS apps, and connected digital platforms from Nairobi, Kenya."
    />

    <meta
      name="robots"
      content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
    />

    <meta
      name="author"
      content="Sterlings Studio"
    />

    <meta
      name="theme-color"
      content="#0F1F35"
    />

    <!--
      IMPORTANT:
      No static canonical is declared here.

      This Vite SPA serves the same index.html for multiple routes.
      src/components/SEO.jsx creates the correct canonical URL
      for each individual route.
    -->

    <!-- =====================================================
         OPEN GRAPH FALLBACK
         WhatsApp • Facebook • LinkedIn • Telegram
         ===================================================== -->

    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:site_name"
      content="Sterlings Studio"
    />

    <meta
      property="og:title"
      content="Websites that load in 0.5s. Apps that scale. Built to last."
    />

    <meta
      property="og:description"
      content="Sterlings Studio builds professional websites, web applications, Android and iOS apps, and connected digital platforms from Nairobi, Kenya."
    />

    <meta
      property="og:image"
      content="https://sterlingsstudio.com/sterling-share-preview.png"
    />

    <meta
      property="og:image:secure_url"
      content="https://sterlingsstudio.com/sterling-share-preview.png"
    />

    <meta
      property="og:image:type"
      content="image/png"
    />

    <meta
      property="og:image:alt"
      content="Sterlings Studio — Websites that load in 0.5s. Apps that scale. Built to last."
    />

    <meta
      property="og:locale"
      content="en_KE"
    />

    <!--
      No static og:url is declared here.

      SEO.jsx sets the correct og:url for each route.
    -->

    <!-- =====================================================
         X / TWITTER FALLBACK
         ===================================================== -->

    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="Websites that load in 0.5s. Apps that scale. Built to last."
    />

    <meta
      name="twitter:description"
      content="Professional websites, web applications, Android and iOS apps, and connected digital platforms. Built in Nairobi for Africa and international markets."
    />

    <meta
      name="twitter:image"
      content="https://sterlingsstudio.com/sterling-share-preview.png"
    />

    <meta
      name="twitter:image:alt"
      content="Sterlings Studio — Websites that load in 0.5s. Apps that scale. Built to last."
    />

    <!--
      Structured data is intentionally not duplicated here.
      src/components/SEO.jsx creates route-aware JSON-LD.
    -->
  </head>

  <body>
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.jsx"
    ></script>
  </body>
</html>
